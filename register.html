<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Google Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- CSS -->
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/auth.css" />
</head>
<body>

<main class="auth register">
  <div class="auth-card">
    <div class="auth-header">
      <img src="./assets/images/logo.png" alt="Chill Logo" class="auth-logo" />
      <h1 class="auth-title heading-3">Daftar</h1>
      <p class="auth-subtitle body-medium-regular">Selamat datang!</p>
    </div>

    <form class="auth-form">
      <div class="form-group">
        <label for="username" class="form-label caption-2-medium">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Masukkan username" />
      </div>
      <div class="form-group">
        <label for="password" class="form-label caption-2-medium">Kata Sandi</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="Masukkan kata sandi" />
          <span class="material-symbols-outlined input-icon">
            visibility_off
          </span>
        </div>
      </div>
      <div class="form-group">
        <label for="confirm-password" class="form-label caption-2-medium">Konfirmasi Kata Sandi</label>
        <div class="input-wrapper">
          <input type="password" id="confirm-password" class="form-input" placeholder="Masukkan kata sandi" />
          <span class="material-symbols-outlined input-icon">
            visibility_off
          </span>
        </div>
      </div>

      <div class="auth-redirect">
        <span>Sudah punya akun? <a href="./login.html" class="auth-link">Masuk</a></span>
      </div>

      <div class="auth-actions">
        <button class="auth-btn btn-secondary-contained">Daftar</button>
        <p class="auth-divider">Atau</p>
        <button class="auth-btn btn-secondary-outlined">
          <img src="./assets/icons/google-icon.png" alt="Google logo" class="btn-icon" />
          Masuk dengan Google
        </button>
      </div>
    </form>
  </div>
</main>

</body>
</html>
